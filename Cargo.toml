[package]
name = "rvnc"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Single-binary VNC server for an existing X display, with an embedded noVNC web client"
license = "MIT"

[[bin]]
name = "rvnc"
path = "src/main.rs"

[dependencies]
x11rb = { version = "0.14", default-features = false, features = [
    "damage",
    "xfixes",
    "xtest",
    "randr",
] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
include_dir = "0.7"
sha1 = { version = "0.10", default-features = false }
des = { version = "0.8", default-features = false }
cipher = { version = "0.4", default-features = false }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
